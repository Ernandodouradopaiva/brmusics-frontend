# Ingress do BRMusics — roteamento correto
#
# IMPORTANTE:
#   - Todo tráfego do host vai para brmusics-frontend.
#   - brmusics-api permanece ClusterIP interno.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brmusics-ingress
  namespace: brmusics
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: SEU_DOMINIO_BRMUSICS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brmusics-frontend
                port:
                  number: 3002
  tls:
    - hosts:
        - SEU_DOMINIO_BRMUSICS
      secretName: brmusics-tls

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brmusics-frontend
  namespace: brmusics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brmusics-frontend
  template:
    metadata:
      labels:
        app: brmusics-frontend
    spec:
      containers:
        - name: brmusics-frontend
          image: ernandopaiva/brmusics-frontend:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: brmusics-frontend-config
          readinessProbe:
            httpGet:
              path: /login
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: brmusics-frontend
  namespace: brmusics
spec:
  selector:
    app: brmusics-frontend
  ports:
    - port: 3002
      targetPort: 3002
