# ConfigMap do brmusics-frontend (Kubernetes).
# APP_URL é lida em runtime. Não dependa só de NEXT_PUBLIC_*.

apiVersion: v1
kind: ConfigMap
metadata:
  name: brmusics-frontend-config
  namespace: SEU_NAMESPACE
data:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"
  PORT: "3002"

  BRMUSICS_API_INTERNAL_URL: "http://brmusics-api:8081"
  APP_URL: "https://SEU_DOMINIO_BRMUSICS"
  NEXT_PUBLIC_APP_URL: "https://SEU_DOMINIO_BRMUSICS"
