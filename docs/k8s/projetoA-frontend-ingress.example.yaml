# Ingress do Projeto A — roteamento correto
#
# IMPORTANTE:
#   - Todo tráfego do host vai para projetoA-frontend.
#   - projetoA-api permanece ClusterIP interno.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: projetoa-ingress
  namespace: conecta
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: SEU_DOMINIO_PROJETOA
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: projetoa-frontend
                port:
                  number: 3002
  tls:
    - hosts:
        - SEU_DOMINIO_PROJETOA
      secretName: projetoa-tls

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projetoa-frontend
  namespace: conecta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projetoa-frontend
  template:
    metadata:
      labels:
        app: projetoa-frontend
    spec:
      containers:
        - name: projetoa-frontend
          image: hub.sps.ce.gov.br/conecta/projetoA-frontend:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: projetoA-frontend-config
          readinessProbe:
            httpGet:
              path: /login
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: projetoa-frontend
  namespace: conecta
spec:
  selector:
    app: projetoa-frontend
  ports:
    - port: 3002
      targetPort: 3002
