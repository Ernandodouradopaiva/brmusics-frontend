services:
  brmusics-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ernandopaiva/brmusics-frontend:1.0.3
    container_name: brmusics-frontend
    hostname: brmusics-frontend
    ports:
      - "3002:3002"
    restart: always
    env_file:
      - ./config/brmusics-frontend.prod.env
    environment:
      PORT: "3002"
      BRMUSICS_API_INTERNAL_URL: http://brmusics-api:8081
      APP_URL: http://181.215.134.218:3002
      NEXT_PUBLIC_APP_URL: http://181.215.134.218:3002
    networks:
      - brmusics-net

networks:
  brmusics-net:
    name: brmusics-net
    external: true
